# Optional: put the scorer behind nginx for TLS or a hostname.
#
#   sudo cp deploy/nginx-dart-scorer.conf /etc/nginx/sites-available/dart-scorer
#   sudo ln -s /etc/nginx/sites-{available,enabled}/dart-scorer
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then bind the service to localhost only: set DART_HOST=127.0.0.1 in
# /etc/default/dart-scorer and restart it.

server {
    listen 80;
    server_name darts.local;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # The video stream and the event stream are both long-lived and must
        # not be buffered, or the browser sees nothing until the buffer fills.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding off;
    }
}
