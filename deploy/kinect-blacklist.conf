# The Kinect v1 camera is driven by libfreenect over raw USB, not by V4L2.
# gspca_kinect claims the same interface and presents a /dev/video node that
# enumerates but cannot stream, which both breaks capture on it and shifts the
# index of every other camera on the machine.
#
# blacklist stops udev autoloading it on hotplug; the install line also stops it
# being pulled in any other way, which is what makes this survive a reboot.
blacklist gspca_kinect
install gspca_kinect /bin/false
